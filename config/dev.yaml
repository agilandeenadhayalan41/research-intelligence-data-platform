# Local-only placeholder, not a deployed development environment.
# storage.backend local and warehouse.analytical duckdb are local values, NOT
# the GCP target (GCS + BigQuery). Nothing runs with this file: the Step 12/13
# pipelines accept environment: local, or gcp-sandbox only with the explicit
# DE-06 GCS opt-in, and the Step 19 runner accepts environment: local only.
# The #108 Stage 3 and #118 runs in the operator's personal project labelled
# DEV (synthetic data; not an enterprise-managed DEV) used the operator scripts
# in scripts/ with GOOGLE_CLOUD_PROJECT and their own flags, not this file.
# Real environment configuration: DE-13 (#134) and DE-04 (#125).
environment: dev
storage:
  backend: local
warehouse:
  analytical: duckdb
