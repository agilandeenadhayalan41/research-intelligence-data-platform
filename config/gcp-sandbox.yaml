# Shape only: GCS/BigQuery identifiers from environment variables; creates no
# resources. Nothing runs with this file: the local pipelines and the Step 19
# runner accept environment: local only, and no code builds an adapter from it.
# The #103 and #108 Stage 1-2 GCP_SANDBOX runs (operator-owned project,
# synthetic data) used the operator scripts in scripts/ with
# GOOGLE_CLOUD_PROJECT and their own flags, not this file; the repo BigQuery SQL
# hard-codes the dataset name openalex (DE-13, #134).
environment: gcp-sandbox
log_level: INFO
source: openalex
storage:
  backend: gcs
  bucket: ${GCS_BUCKET}
warehouse:
  transactional: postgres
  analytical: bigquery
  postgres_dsn_env: POSTGRES_DSN
  bigquery_dataset: ${BIGQUERY_DATASET}
cloud:
  project_id: ${GOOGLE_CLOUD_PROJECT}
