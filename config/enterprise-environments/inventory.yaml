# Enterprise environment inventory for DE-04 (#125): a non-secret approval record.
# For the enterprise-managed GCP_SANDBOX, DEV and QA environments it records which
# facts are approved and where each approval is recorded (a comment on #125).
# It is not environment configuration and not readiness evidence: nothing deploys
# from it, and the readiness registry does not read it.
# Never add project IDs or numbers, organization, folder or billing-account IDs,
# bucket names, identity or group names, emails, network names, IP ranges, run IDs,
# amounts or prices. Real identifiers live in the DE-13 (#134) environment
# configuration and in Secret Manager (DE-23, #144), never in this repository.
# Comments are allowed only in this header. The item catalog, owner roles and
# allowed answers are defined in src/research_platform/readiness/enterprise_inventory.py.
# Rendered page: docs/operations/enterprise-environment-inventory.md
